<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8ff" />

    <!--
      Applies the saved theme before the first paint. Inline and synchronous on
      purpose: loading it as a module would let the default paint first and the
      page would flash the wrong theme on every visit.

      Light is the default in the tag above, so a visitor who has never chosen
      gets the intended ground even if this script never runs.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }
        } catch (e) {
          /* Private mode blocks storage; the light default in the tag stands. */
        }
      })()
    </script>
